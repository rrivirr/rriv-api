apiVersion: apps/v1
kind: Deployment
metadata:
  name: rriv-api
spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/prod-rriv-api-creds"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/data/prod-rriv-api-creds" }}
          DATABASE_URL="{{ .Data.data.database_url }}"
          KEYCLOAK_CLIENT_SECRET="{{ .Data.data.keycloak_client_secret }}"
          KEYCLOAK_AUTH_CLIENT_SECRET="{{ .Data.data.keycloak_auth_client_secret }}"
          CHIRPSTACK_API_KEY="{{ .Data.data.chirpstack_downlink_key }}"
          DATABASE_CA_CRT="{{ .Data.data.database_ca_cert }}"
          {{ end }}
    spec:
      containers:
        - name: rriv-api
          env:
            - name: KEYCLOAK_URL
              value: https://auth.rriv.org
            - name: KEYCLOAK_REALM
              value: rriv-beta-prod
