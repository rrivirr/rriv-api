apiVersion: batch/v1
kind: Job
metadata:
  name: rriv-api-migration-job
  labels:
    app: rriv-api
spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/rriv-api-creds"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/data/rriv-api-creds" }}
          DATABASE_URL="{{ .Data.data.database_migration_url }}"
          DATABASE_CA_CRT="{{ .Data.data.database_ca_cert }}"
          {{ end }}
