apiVersion: batch/v1
kind: Job
metadata:
  name: rriv-api-migration-job
  labels:
    app: rriv-api
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: rriv-api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: "rriv-api"
        vault.hashicorp.com/agent-requests-cpu: "10m"
        vault.hashicorp.com/agent-requests-memory: "32Mi"
        vault.hashicorp.com/agent-limits-cpu: "500m"
        vault.hashicorp.com/agent-limits-memory: "128Mi"
        vault.hashicorp.com/auth-path: "auth/kubernetes-rriv"
        vault.hashicorp.com/secret-volume-path: "/app/config"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/rriv-api-creds"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/data/rriv-api-creds" }}
          DATABASE_URL="{{ .Data.data.database_migration_url }}"
          DATABASE_CA_CRT="{{ .Data.data.database_ca_cert }}"
          {{ end }}
    spec:
      restartPolicy: Never
      serviceAccountName: internal-app
      imagePullSecrets:
        - name: registry-rriv
      containers:
        - name: rriv-api-migration-job
          command: ["deno", "task", "prisma", "migrate", "deploy"]
          image: registry.digitalocean.com/rriv/rriv-api-migrate:latest
          env:
            - name: DATABASE_SCHEMA
              value: rriv
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 384Mi
