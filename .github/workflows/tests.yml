name: Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rriv_test?schema=rriv
    services:
      postgres:
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rriv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rriv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}

      - name: Install dependencies
        run: deno install

      - name: Generate Prisma client
        run: deno task prisma generate

      - name: Prepare database
        run: deno task test:prepare

      - name: Lint
        run: deno lint

      - name: Type-check
        run: deno check src/app.ts

      - name: Test (with coverage threshold)
        run: deno task coverage
